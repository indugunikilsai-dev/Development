# FuCad streamed to the browser for the portal's FreeCAD page.
#
#   docker compose -f fucad-stream/docker-compose.yml up -d --build   (first build: ~1-2 hours)
#   docker compose -f fucad-stream/docker-compose.yml up -d           (later starts)
#
# Then open http://localhost:3000 directly, or the FreeCAD page in the portal.
services:
  fucad:
    build:
      context: ../FuCad
      dockerfile: ../fucad-stream/Dockerfile
      args:
        BUILD_JOBS: 6
    image: fucad-stream:26.3.2
    container_name: fucad
    ports:
      - "3000:3000"
      # Download service for the portal's "Downloads" button (files saved from FuCad).
      - "3001:3001"
    # Qt and the web client use shared memory; the default 64 MB makes the session unstable.
    shm_size: 1gb
    environment:
      - PUID=1000
      - PGID=1000
      - TITLE=FuCad
    volumes:
      # FuCad settings, macros and saved files survive container restarts.
      - fucad-config:/config
      # Save / Save As in FuCad open this folder, which is a real folder on this PC.
      # Default: D:\devo\fucad-files (next to this repo). Choose another with FUCAD_HOST_DIR, e.g.
      #   $env:FUCAD_HOST_DIR = "$env:USERPROFILE\Documents\FuCad"; docker compose ... up -d
      - ${FUCAD_HOST_DIR:-../fucad-files}:/config/FuCad-Files
    restart: unless-stopped

volumes:
  fucad-config:
