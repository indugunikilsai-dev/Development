# FuCad streamed to the browser for the portal's FreeCAD page.
#
#   docker compose -f fucad-stream/docker-compose.yml up -d --build   (first build: ~1-2 hours)
#   docker compose -f fucad-stream/docker-compose.yml up -d           (later starts)
#
# Then open http://localhost:3000 directly, or the FreeCAD page in the portal.
services:
  fucad:
    build:
      context: ../FuCad
      dockerfile: ../fucad-stream/Dockerfile
      # The portal bridge (File > Open / Save on the user's PC), shared with Dockerfile.freecad.
      additional_contexts:
        bridge: ./bridge
      args:
        BUILD_JOBS: 6
    image: fucad-stream:26.3.2
    container_name: fucad
    ports:
      - "3000:3000"
      - "3001:3001"
      # File service: moves files between FuCad and the PC through the portal page.
      - "3002:3002"
    # Qt and the web client use shared memory; the default 64 MB makes the session unstable.
    shm_size: 1gb
    environment:
      - PUID=1000
      - PGID=1000
      - TITLE=FuCad
    volumes:
      # FuCad settings, and the documents open in it, survive container restarts.
      - fucad-config:/config
    restart: unless-stopped

volumes:
  fucad-config:
